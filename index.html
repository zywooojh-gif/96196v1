<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Your Voice">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0b">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Your%20Voice%22%2C%22short_name%22%3A%22Your%20Voice%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0d0b%22%2C%22theme_color%22%3A%22%230d0d0b%22%2C%22start_url%22%3A%22.%22%7D">
<!-- iOS touch icon (inline SVG as data URI) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230d0d0b' rx='40'/%3E%3Ccircle cx='90' cy='90' r='36' fill='none' stroke='%23e8e3d8' stroke-width='1.5' opacity='.4'/%3E%3Ccircle cx='90' cy='90' r='20' fill='%23e8e3d8' opacity='.2'/%3E%3Ccircle cx='90' cy='90' r='8' fill='%23e8e3d8' opacity='.7'/%3E%3C/svg%3E">
<title>Your Voice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#0d0d0b;--text:#e8e3d8;--dim:rgba(232,227,216,0.32);--dim2:rgba(232,227,216,0.55);
  --border:rgba(232,227,216,0.09);--border2:rgba(232,227,216,0.2);
  --blob:220,214,200;--ibg:rgba(232,227,216,0.04);--btn:#e8e3d8;--btntxt:#0d0d0b;
  --panel:#111110;--glass:rgba(0,0,0,0.62);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
[data-theme=day]{
  --bg:#f2efe8;--text:#1a1714;--dim:rgba(26,23,20,0.35);--dim2:rgba(26,23,20,0.55);
  --border:rgba(26,23,20,0.09);--border2:rgba(26,23,20,0.2);
  --blob:26,22,16;--ibg:rgba(26,23,20,0.04);--btn:#1a1714;--btntxt:#f2efe8;
  --panel:#ebe8e1;--glass:rgba(242,239,232,0.72);
}

html,body{
  height:100%;background:var(--bg);color:var(--text);
  font-family:'DM Mono',monospace;font-weight:300;overflow:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s,color .5s;
  /* Extend into notch/home areas */
  background-attachment:fixed;
}

.app{
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  /* Safe area padding */
  padding-top:var(--sat);
  padding-bottom:var(--sab);
  padding-left:var(--sal);
  padding-right:var(--sar);
}

header{width:100%;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 20px;flex-shrink:0}
.mark{display:flex;flex-direction:column;gap:3px}
.mark-a{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.mark-b{font-size:8px;letter-spacing:.16em;color:var(--dim);opacity:.55}
.hbtns{display:flex;gap:6px}
.hbtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:border-color .2s,color .2s;outline:none;
  /* Larger hit area for touch */
  position:relative;
}
.hbtn::before{content:'';position:absolute;inset:-6px;border-radius:50%}
.hbtn:active{background:var(--border);color:var(--text)}
.hbtn svg{width:14px;height:14px;stroke-width:1.4}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:28px;padding:0 20px;min-height:0}
canvas{display:block}

.subs{text-align:center;min-height:68px;max-width:600px;width:100%;display:flex;flex-direction:column;align-items:center;gap:9px}
.sub-en{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:300;font-style:italic;line-height:1.45;color:var(--text);min-height:30px;opacity:0;transform:translateY(5px);transition:opacity .5s,transform .5s}
.sub-en.on{opacity:1;transform:none}
.sub-zh{font-size:10.5px;letter-spacing:.07em;color:var(--dim);min-height:16px;opacity:0;transition:opacity .5s .12s}
.sub-zh.on{opacity:1}

.foot{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;padding-bottom:2px}
.status{font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);height:13px;text-align:center}
.badge{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.5}

.inp-wrap{width:100%;max-width:520px;padding:0 18px 16px;flex-shrink:0}
.inp-row{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:100px;padding:8px 8px 8px 20px;background:var(--ibg);transition:border-color .25s}
.inp-row:focus-within{border-color:var(--border2)}
.inp{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font-size:16px;/* 16px prevents iOS zoom on focus */
  font-family:'DM Mono',monospace;font-weight:300;letter-spacing:.02em;
}
.inp::placeholder{color:var(--dim)}
.mic,.send{
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  outline:none;transition:opacity .2s,transform .12s,background .2s,border-color .2s;
  /* Prevent double-tap zoom */
  touch-action:manipulation;
}
.mic svg,.send svg{width:15px;height:15px;stroke-width:1.4}
.mic{background:transparent;border:1px solid var(--border);color:var(--dim)}
.mic:active{background:var(--border);color:var(--text)}
.mic.rec{background:#b03030;border-color:#b03030;color:#fff;animation:pr 1.2s ease-in-out infinite}
.send{background:var(--btn);color:var(--btntxt)}
.send:active{opacity:.7;transform:scale(.92)}
.send:disabled{opacity:.22;cursor:default;transform:none}

@keyframes pr{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes bk{0%,80%,100%{opacity:.18}40%{opacity:1}}
.dot{display:inline-block;animation:bk 1.4s infinite both}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}

/* Settings */
.ov{position:fixed;inset:0;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
.ov.on{opacity:1;pointer-events:all}
.sp{
  position:fixed;top:0;right:0;bottom:0;
  width:min(314px, 90vw);
  background:var(--panel);border-left:1px solid var(--border);
  padding:20px 18px;
  padding-top:calc(20px + var(--sat));
  padding-bottom:calc(24px + var(--sab));
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.22,1,.36,1);
  z-index:21;display:flex;flex-direction:column;gap:14px;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.sp.on{transform:translateX(0)}
.sp-hd{display:flex;justify-content:space-between;align-items:center}
.sp-ttl{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* Presets */
.presets-label{font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.presets{display:flex;flex-wrap:wrap;gap:5px}
.preset{padding:4px 10px;border-radius:100px;border:1px solid var(--border);background:none;color:var(--dim);font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.08em;cursor:pointer;transition:border-color .2s,color .2s,background .2s}
.preset:hover{border-color:var(--border2);color:var(--text)}

/* Detected badge */
.detect-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:var(--ibg);border:1px solid var(--border)}
.detect-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.detect-dot.anthropic{background:#c87941}
.detect-dot.openai{background:#4a9f6a}
.detect-txt{font-size:9.5px;color:var(--dim);letter-spacing:.05em}
.detect-fmt{font-size:9px;color:var(--dim);opacity:.65;margin-left:auto;letter-spacing:.06em}

.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:8.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim)}
.fld input,.fld select{background:var(--ibg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:11px;font-family:'DM Mono',monospace;font-weight:300;outline:none;transition:border-color .2s;width:100%;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--border2)}
hr.dv{border:none;border-top:1px solid var(--border)}
.savebtn{padding:10px;border-radius:100px;border:none;background:var(--btn);color:var(--btntxt);font-size:9.5px;font-family:'DM Mono',monospace;letter-spacing:.12em;cursor:pointer;transition:opacity .2s;margin-top:auto}
.savebtn:hover{opacity:.75}
.snote{font-size:9.5px;color:var(--dim);line-height:1.7}
/* ── Memory bottom sheet ── */
.mem-ov{position:fixed;inset:0;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
.mem-ov.on{opacity:1;pointer-events:all}
.mem-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding-bottom:calc(16px + var(--sab));transform:translateY(100%);transition:transform .4s cubic-bezier(.22,1,.36,1);z-index:21;display:flex;flex-direction:column;max-height:78vh}
.mem-sheet.on{transform:translateY(0)}
.mem-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;flex-shrink:0}
.mem-head{display:flex;align-items:center;padding:14px 18px 6px;gap:10px;flex-shrink:0}
.mem-ttl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);flex:1}
.mem-upd{font-size:8px;color:var(--dim);opacity:.45;letter-spacing:.05em}
.mem-intervals{display:flex;gap:5px;padding:8px 18px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.mint{padding:5px 11px;border-radius:100px;border:1px solid var(--border);background:none;color:var(--dim);font-size:9px;font-family:'DM Mono',monospace;letter-spacing:.08em;cursor:pointer;transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mint.on{background:var(--border2);color:var(--text);border-color:var(--border2)}
.mem-list{flex:1;overflow-y:auto;padding:4px 18px;-webkit-overflow-scrolling:touch}
.mem-empty{font-size:11px;color:var(--dim);text-align:center;padding:28px 0;opacity:.45;letter-spacing:.05em}
.mem-item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.mem-item:last-child{border-bottom:none}
.mem-txt{flex:1;font-size:11.5px;color:var(--text);line-height:1.6;background:none;border:none;outline:none;resize:none;font-family:'DM Mono',monospace;font-weight:300;padding:0;width:100%;caret-color:var(--text);overflow:hidden}
.mem-del{width:26px;height:26px;border-radius:50%;border:none;background:none;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;touch-action:manipulation;opacity:.6}
.mem-del:active{opacity:1}
.mem-add-row{display:flex;align-items:center;gap:8px;padding:10px 18px 4px;border-top:1px solid var(--border);flex-shrink:0}
.mem-inp{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px;font-family:'DM Mono',monospace;font-weight:300;letter-spacing:.02em}
.mem-inp::placeholder{color:var(--dim)}
.mem-add-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--btn);color:var(--btntxt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;touch-action:manipulation;line-height:1}
/* Persona textarea */
.fld textarea{background:var(--ibg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:11px;font-family:'DM Mono',monospace;font-weight:300;outline:none;transition:border-color .2s;width:100%;resize:none;line-height:1.6;min-height:80px}
.fld textarea:focus{border-color:var(--border2)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">
      <span class="mark-a">Your Voice</span>
      <span class="mark-b">V1.0</span>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="tbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button class="hbtn" id="mbtn" title="Memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/><circle cx="18.5" cy="19.5" r="1" fill="currentColor" stroke="none" opacity=".5"/><circle cx="20.5" cy="21.5" r=".6" fill="currentColor" stroke="none" opacity=".35"/></svg>
      </button>
      <button class="hbtn" id="sbtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="subs">
      <div class="sub-en" id="se"></div>
      <div class="sub-zh" id="sz"></div>
    </div>
  </div>

  <div class="foot">
    <div class="status" id="st"></div>
    <div class="badge" id="bg"></div>
  </div>

  <div class="inp-wrap">
    <div class="inp-row">
      <input class="inp" id="ti" type="text" placeholder="type or speak..." autocomplete="off" spellcheck="false">
      <button class="mic" id="mb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 19v3M8 22h8"/></svg>
      </button>
      <button class="send" id="snd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Memory bottom sheet -->
<div class="mem-ov" id="mem-ov"></div>
<div class="mem-sheet" id="mem-sheet">
  <div class="mem-handle"></div>
  <div class="mem-head">
    <span class="mem-ttl">Memory</span>
    <span class="mem-upd" id="mem-upd"></span>
    <button class="hbtn" id="mem-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="mem-intervals">
    <button class="mint on" data-v="auto">自动</button>
    <button class="mint" data-v="5">5 min</button>
    <button class="mint" data-v="10">10 min</button>
    <button class="mint" data-v="30">30 min</button>
  </div>
  <div class="mem-list" id="mem-list"></div>
  <div class="mem-add-row">
    <input class="mem-inp" id="mem-inp" type="text" placeholder="Add a memory manually...">
    <button class="mem-add-btn" id="mem-add-btn">+</button>
  </div>
</div>

<!-- iOS install hint -->
<div id="install-hint" style="display:none;position:fixed;bottom:calc(80px + var(--sab));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:10px;letter-spacing:.08em;color:var(--dim);white-space:nowrap;z-index:30;text-align:center;line-height:1.6">
  Safari → 分享 → 添加到主屏幕<br>
  <span style="opacity:.5;font-size:9px">即可全屏无地址栏使用</span>
</div>

<div class="ov" id="ov"></div>
<div class="sp" id="sp">
  <div class="sp-hd">
    <span class="sp-ttl">Settings</span>
    <button class="hbtn" id="sc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="fld">
    <label>AI Persona</label>
    <textarea id="s-persona" placeholder="Describe the AI's personality, tone, name, or role... e.g. Your name is Nova. You are witty, warm, and a little mysterious. You speak like someone who's lived a lot and has great stories."></textarea>
  </div>

  <hr class="dv">

  <!-- Quick presets -->
  <div>
    <div class="presets-label" style="margin-bottom:7px">Quick Presets</div>
    <div class="presets">
      <button class="preset" onclick="applyPreset('anthropic')">Anthropic</button>
      <button class="preset" onclick="applyPreset('openai')">OpenAI</button>
      <button class="preset" onclick="applyPreset('deepseek')">DeepSeek</button>
      <button class="preset" onclick="applyPreset('deepseek_ant')">DeepSeek (Anthropic)</button>
      <button class="preset" onclick="applyPreset('groq')">Groq</button>
      <button class="preset" onclick="applyPreset('ollama')">Ollama</button>
    </div>
  </div>

  <hr class="dv">

  <!-- API Config -->
  <div class="fld">
    <label>API Base URL</label>
    <input type="text" id="fu" placeholder="https://api.anthropic.com/v1" oninput="refreshDetect()">
  </div>

  <!-- Auto-detect badge -->
  <div class="detect-row" id="det">
    <div class="detect-dot" id="det-dot"></div>
    <span class="detect-txt" id="det-txt"></span>
    <span class="detect-fmt" id="det-fmt"></span>
  </div>

  <div class="fld">
    <label>API Key</label>
    <input type="password" id="fk" placeholder="your api key...">
  </div>
  <div class="fld">
    <label>Model</label>
    <input type="text" id="fm" placeholder="e.g. claude-sonnet-4-6 / gpt-4o / deepseek-chat">
  </div>

  <hr class="dv">

  <div class="fld">
    <label>ElevenLabs API Key</label>
    <input type="password" id="ek" placeholder="...">
  </div>
  <div class="fld">
    <label>Voice ID</label>
    <input type="text" id="ev" placeholder="jaSvRYaJHY4hCfcE2gCB">
  </div>
  <div class="fld">
    <label>TTS Model</label>
    <select id="etm">
      <option value="eleven_flash_v2_5">Flash v2.5 — 最快最省积分</option>
      <option value="eleven_turbo_v2_5">Turbo v2.5 — 速度与质量平衡</option>
      <option value="eleven_multilingual_v2" selected>Multilingual v2 — 最高质量</option>
    </select>
  </div>

  <hr class="dv">

  <div class="fld">
    <label>AI Response Language</label>
    <select id="rpl">
      <option value="en-US">English</option>
      <option value="zh-CN">中文 普通话</option>
      <option value="zh-TW">中文 繁體</option>
      <option value="ja-JP">日本語</option>
      <option value="ko-KR">한국어</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
      <option value="es-ES">Español</option>
    </select>
  </div>

  <div class="fld">
    <label>Recognition Language</label>
    <select id="rl">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="zh-CN">中文 普通话</option>
      <option value="zh-TW">中文 繁體</option>
      <option value="ja-JP">日本語</option>
      <option value="ko-KR">한국어</option>
    </select>
  </div>

  <p class="snote">Keys are stored only in your browser's localStorage and sent directly to each API — never anywhere else.</p>

  <button class="savebtn" id="svb">Save & Close</button>
</div>

<script>
const TAU = Math.PI * 2;

// ── Config ────────────────────────────────────────────────────────────────────
let C = {
  apiUrl: 'https://api.anthropic.com/v1',
  apiKey: '', model: 'claude-sonnet-4-6',
  elKey: '', voiceId: 'jaSvRYaJHY4hCfcE2gCB', ttsModel: 'eleven_multilingual_v2',
  theme: 'night', lang: 'en-US', respLang: 'en-US',
  persona: '', memInterval: 'auto'
};

// Memories stored separately
let memories = [];
try { memories = JSON.parse(localStorage.getItem('yv-mem') || '[]'); } catch(e) {}
const saveMem = () => { try { localStorage.setItem('yv-mem', JSON.stringify(memories)); } catch(e) {} };
const memId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);

const LANG_NAMES = {
  'en-US': 'English', 'en-GB': 'English',
  'zh-CN': 'Chinese', 'zh-TW': 'Chinese',
  'ja-JP': 'Japanese', 'ko-KR': 'Korean',
  'fr-FR': 'French', 'de-DE': 'German', 'es-ES': 'Spanish'
};
function getLangName(code) { return LANG_NAMES[code] || 'English'; }
function isChinese(code) { return code && code.startsWith('zh'); }
try { const s = localStorage.getItem('nv5'); if (s) Object.assign(C, JSON.parse(s)); } catch(e) {}
const save = () => { try { localStorage.setItem('nv5', JSON.stringify(C)); } catch(e) {} };

// ── Provider detection ────────────────────────────────────────────────────────
const PRESETS = {
  anthropic:    { url: 'https://api.anthropic.com/v1',          model: 'claude-sonnet-4-6',       label: 'Anthropic' },
  openai:       { url: 'https://api.openai.com/v1',             model: 'gpt-4o',                  label: 'OpenAI' },
  deepseek:     { url: 'https://api.deepseek.com/v1',           model: 'deepseek-chat',           label: 'DeepSeek' },
  deepseek_ant: { url: 'https://api.deepseek.com/anthropic/v1', model: 'deepseek-chat',           label: 'DeepSeek (Anthropic)' },
  groq:         { url: 'https://api.groq.com/openai/v1',        model: 'llama-3.3-70b-versatile', label: 'Groq' },
  ollama:       { url: 'http://localhost:11434/v1',              model: 'llama3.2',                label: 'Ollama (local)' },
};

function detectFormat(url) {
  if (!url) return null;
  // any URL containing 'anthropic' uses Anthropic message format
  if (url.includes('anthropic')) return 'anthropic';
  return 'openai';
}

function detectLabel(url) {
  if (!url) return { name: '—', fmt: '' };
  for (const [k, v] of Object.entries(PRESETS)) {
    if (url.startsWith(v.url.split('/v1')[0])) {
      const fmt = detectFormat(url);
      return { name: v.label, fmt: fmt === 'anthropic' ? 'Anthropic format' : 'OpenAI-compatible' };
    }
  }
  const fmt = detectFormat(url);
  return { name: 'Custom', fmt: fmt === 'anthropic' ? 'Anthropic format' : 'OpenAI-compatible' };
}

function refreshDetect() {
  const url = document.getElementById('fu').value.trim();
  const fmt = detectFormat(url);
  const info = detectLabel(url);
  const dot = document.getElementById('det-dot');
  dot.className = 'detect-dot ' + (fmt || '');
  document.getElementById('det-txt').textContent = info.name;
  document.getElementById('det-fmt').textContent = info.fmt;
}

function applyPreset(key) {
  const p = PRESETS[key];
  document.getElementById('fu').value = p.url;
  document.getElementById('fm').value = p.model;
  refreshDetect();
}

// ── Theme ─────────────────────────────────────────────────────────────────────
const applyTheme = () => {
  document.body.dataset.theme = C.theme;
  document.querySelector('#tbtn svg').innerHTML = C.theme === 'day'
    ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="none" stroke="currentColor" stroke-width="1.4"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
};
document.getElementById('tbtn').onclick = () => { C.theme = C.theme === 'night' ? 'day' : 'night'; save(); applyTheme(); };
applyTheme();

// ── Settings ──────────────────────────────────────────────────────────────────
const spEl = document.getElementById('sp'), ovEl = document.getElementById('ov');
const closeS = () => { spEl.classList.remove('on'); ovEl.classList.remove('on'); };

document.getElementById('sbtn').onclick = () => {
  document.getElementById('fu').value = C.apiUrl;
  document.getElementById('fk').value = C.apiKey;
  document.getElementById('fm').value = C.model;
  document.getElementById('ek').value = C.elKey;
  document.getElementById('ev').value = C.voiceId;
  document.getElementById('etm').value = C.ttsModel || 'eleven_multilingual_v2';
  document.getElementById('rl').value = C.lang;
  document.getElementById('rpl').value = C.respLang;
  document.getElementById('s-persona').value = C.persona || '';
  refreshDetect();
  spEl.classList.add('on'); ovEl.classList.add('on');
};
document.getElementById('sc').onclick = closeS;
ovEl.onclick = closeS;

document.getElementById('svb').onclick = () => {
  C.apiUrl = document.getElementById('fu').value.trim() || 'https://api.anthropic.com/v1';
  C.apiKey = document.getElementById('fk').value.trim();
  C.model  = document.getElementById('fm').value.trim();
  C.elKey  = document.getElementById('ek').value.trim();
  C.voiceId = document.getElementById('ev').value.trim() || 'jaSvRYaJHY4hCfcE2gCB';
  C.ttsModel = document.getElementById('etm').value;
  C.lang   = document.getElementById('rl').value;
  C.respLang = document.getElementById('rpl').value;
  C.persona = document.getElementById('s-persona').value.trim();
  if (recog) recog.lang = C.lang;
  save(); closeS(); updateBadge(); setS('Saved', 2200);
};

// ── Status & badge ────────────────────────────────────────────────────────────
let stT = null;
const setS = (m, d = 0) => {
  document.getElementById('st').innerHTML = m;
  clearTimeout(stT);
  if (d) stT = setTimeout(() => document.getElementById('st').innerHTML = '', d);
};
const updateBadge = () => {
  const info = detectLabel(C.apiUrl);
  const m = C.model ? C.model.split('-').slice(0, 4).join('-').toUpperCase() : '';
  document.getElementById('bg').textContent = [info.name.toUpperCase(), m].filter(Boolean).join(' · ');
};
updateBadge();

// ── Canvas blob ───────────────────────────────────────────────────────────────
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = window.devicePixelRatio || 1;
let W, H, cx, cy;
const resize = () => {
  const s = Math.min(window.innerWidth * .62, window.innerHeight * .38, 270);
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  W = cv.width = Math.round(s * DPR); H = cv.height = Math.round(s * DPR);
  cx = W / 2; cy = H / 2;
};
resize(); window.addEventListener('resize', resize);

let actx = null, anl = null, fbuf = null, playing = false, src = null;
const ensureACtx = async () => {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') await actx.resume();
};
async function playBlob(blob) {
  await ensureACtx();
  const ab = await blob.arrayBuffer();
  const abuf = await actx.decodeAudioData(ab);
  if (src) { try { src.stop(); } catch(e) {} }
  anl = actx.createAnalyser(); anl.fftSize = 512; anl.smoothingTimeConstant = .88;
  fbuf = new Uint8Array(anl.frequencyBinCount);
  src = actx.createBufferSource(); src.buffer = abuf;
  src.connect(anl); anl.connect(actx.destination);
  playing = true; src.start(0);
  src.onended = () => { playing = false; anl = null; fbuf = null; setS(''); };
}

let T = 0;
function getAmp() {
  if (!anl || !fbuf || !playing) return 0;
  anl.getByteFrequencyData(fbuf);
  let s = 0; for (let i = 0; i < Math.min(32, fbuf.length); i++) s += fbuf[i];
  return s / (32 * 255);
}
function drawBlob(x, y, r, maxA, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0,   `rgba(${col},${maxA})`);
  g.addColorStop(.22, `rgba(${col},${maxA * .76})`);
  g.addColorStop(.42, `rgba(${col},${maxA * .46})`);
  g.addColorStop(.62, `rgba(${col},${maxA * .18})`);
  g.addColorStop(.82, `rgba(${col},${maxA * .04})`);
  g.addColorStop(1,   `rgba(${col},0)`);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = g; ctx.fill();
}
function drawFrame() {
  ctx.clearRect(0, 0, W, H); T += .007;
  const amp = getAmp();
  const R = Math.min(W, H) / 2;
  const col = C.theme === 'night' ? '215,208,193' : '22,18,12';
  const br = 1 + Math.sin(T * .85) * .03 + Math.cos(T * .52) * .018;
  const baseR = R * .52 * br * (1 + amp * .6);
  drawBlob(cx, cy, baseR, .44 + amp * .28, col);
  drawBlob(cx + Math.sin(T * .58) * R * .08, cy + Math.cos(T * .44) * R * .07, baseR * .65, .20 + amp * .16, col);
  drawBlob(cx + Math.cos(T * .82 + 1.1) * R * .055, cy + Math.sin(T * .67 + .9) * R * .055, baseR * .4, .11 + amp * .1, col);
  if (amp > .04) drawBlob(cx, cy, R * .88 * (1 + amp * .22), amp * .09, col);
  requestAnimationFrame(drawFrame);
}
drawFrame();

// ── AI ────────────────────────────────────────────────────────────────────────
let hist = [], busy = false;

function buildSYS() {
  const lang = getLangName(C.respLang || 'en-US');
  const isAuto = C.memInterval === 'auto';

  let sys = '';
  if (C.persona && C.persona.trim()) sys += `${C.persona.trim()}\n\n`;

  sys += `You MUST follow these rules:
1. Always respond in ${lang} only, regardless of what language the user speaks.
2. The "reply" field must be ${lang} only — no Chinese characters allowed in "reply".
3. The "chinese" field must always contain a Chinese translation of your reply.
4. Keep responses to 2-3 sentences, natural and conversational.`;

  if (memories.length > 0) {
    sys += `\n\nWhat you remember about the user:\n${memories.map(m => `- ${m.content}`).join('\n')}`;
  }

  if (isAuto) {
    sys += `\n\nIf the user shares personal info worth remembering (name, preferences, habits, goals), add it to "mem". Otherwise "mem" must be null.
Reply ONLY with this JSON (no markdown):
{"reply":"your ${lang} response","chinese":"中文翻译","mem":["fact"] or null}`;
  } else {
    sys += `\n\nReply ONLY with this JSON (no markdown):
{"reply":"your ${lang} response","chinese":"中文翻译"}`;
  }

  return sys;
}

async function translateToChinese(text) {
  // Fallback: if model forgot to include Chinese, translate separately
  try {
    const fmt = detectFormat(C.apiUrl);
    const prompt = `Translate the following text to Chinese. Reply with ONLY the Chinese translation, nothing else:\n"${text}"`;
    if (fmt === 'anthropic') {
      const r = await fetch(`${C.apiUrl}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': C.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: C.model, max_tokens: 200, messages: [{ role: 'user', content: prompt }] })
      });
      if (!r.ok) return '';
      const d = await r.json();
      return extractText(d.content).trim();
    } else {
      const r = await fetch(`${C.apiUrl}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${C.apiKey}` },
        body: JSON.stringify({ model: C.model, max_tokens: 200, messages: [{ role: 'user', content: prompt }] })
      });
      if (!r.ok) return '';
      const d = await r.json();
      return extractText(d.choices).trim();
    }
  } catch(e) { return ''; }
}

function parseJ(raw) {
  try {
    const p = JSON.parse(raw.replace(/```json|```/g, '').trim());
    return {
      reply:   String(p.reply || p.english || p.response || p.text || raw || ''),
      chinese: String(p.chinese || p.translation || p.zh || ''),
      mem:     Array.isArray(p.mem) ? p.mem : null
    };
  }
  catch(e) { return { reply: String(raw || ''), chinese: '', mem: null }; }
}

// Recursively extract text from any API response structure
function extractText(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  if (Array.isArray(obj)) {
    for (const item of obj) { const t = extractText(item); if (t) return t; }
    return '';
  }
  if (typeof obj === 'object') {
    return obj.text || obj.content || extractText(obj.message) || extractText(obj.choices) || '';
  }
  return '';
}

async function callAI(text) {
  if (!C.apiKey) throw new Error('No API key — open ⚙ Settings');
  if (!C.model)  throw new Error('No model set — open ⚙ Settings');
  const fmt = detectFormat(C.apiUrl);
  const SYS = buildSYS();

  if (fmt === 'anthropic') {
    hist.push({ role: 'user', content: text });
    const r = await fetch(`${C.apiUrl}/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': C.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: C.model, max_tokens: 1024, system: SYS, messages: hist })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d?.error?.message || `HTTP ${r.status}`);
    // Recursive extraction to handle any nested structure
    const raw = extractText(d.content) || extractText(d.choices) || '';
    if (!raw) throw new Error(`content=${JSON.stringify(d.content).slice(0,200)}`);
    const p = parseJ(raw);
    hist.push({ role: 'assistant', content: p.reply });
    return p;

  } else {
    hist.push({ role: 'user', content: text });
    const msgs = [{ role: 'system', content: SYS }, ...hist];
    const r = await fetch(`${C.apiUrl}/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${C.apiKey}` },
      body: JSON.stringify({ model: C.model, max_tokens: 1024, messages: msgs })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d?.error?.message || `HTTP ${r.status}`);
    const raw = extractText(d.choices) || extractText(d.content) || '';
    if (!raw) throw new Error(`content=${JSON.stringify(d.choices || d.content).slice(0,200)}`);
    const p = parseJ(raw);
    hist.push({ role: 'assistant', content: p.reply });
    return p;
  }
}

async function callTTS(text) {
  if (!C.elKey) throw new Error('No ElevenLabs key — open ⚙ Settings');
  const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${C.voiceId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'xi-api-key': C.elKey },
    body: JSON.stringify({ text, model_id: C.ttsModel || 'eleven_multilingual_v2', voice_settings: { stability: .45, similarity_boost: .8, style: .25, use_speaker_boost: true } })
  });
  if (!r.ok) { const e = await r.json().catch(() => {}); throw new Error(e?.detail?.message || `ElevenLabs ${r.status}`); }
  return await r.blob();
}

function showSubs(main, zh, forceShowZh = false) {
  const e = document.getElementById('se'), z = document.getElementById('sz');
  e.classList.remove('on'); z.classList.remove('on');
  setTimeout(() => {
    e.textContent = main || '';
    z.textContent = zh || '';
    if (main) e.classList.add('on');
    // Always show Chinese subtitle if it has content
    if (zh) z.classList.add('on');
  }, 160);
}

async function send(text) {
  text = text.trim(); if (!text || busy) return;
  busy = true; document.getElementById('snd').disabled = true;
  document.getElementById('ti').value = '';
  showSubs(text, '');
  try {
    setS('<span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>');
    const r = await callAI(text);
    r.reply = (r.reply || '').replace(/[\u4e00-\u9fff\u3400-\u4dbf\uff00-\uffef\u3000-\u303f]/g, '').replace(/\s{2,}/g, ' ').trim();
    if (!r.reply) throw new Error('No reply received — check your API settings');
    if (!r.chinese && !isChinese(C.respLang)) r.chinese = await translateToChinese(r.reply);
    // Save auto memories
    if (r.mem && r.mem.length > 0) {
      r.mem.forEach(content => {
        if (content && content.trim() && !memories.some(m => m.content === content.trim()))
          memories.push({ id: memId(), content: content.trim(), ts: Date.now() });
      });
      saveMem(); renderMems(); updateMemUpd();
    }
    // Show text first, then speak
    showSubs(r.reply, r.chinese);
    setS('Speaking...');
    try { await playBlob(await callTTS(r.reply)); }
    catch(ttsErr) { setS(ttsErr.message, 4000); }
  } catch(err) { setS(err.message, 5500); console.error(err); }
  document.getElementById('snd').disabled = false; busy = false;
}

document.getElementById('snd').onclick = () => send(document.getElementById('ti').value);
document.getElementById('ti').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e.target.value); } });

// ── Speech Recognition ────────────────────────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recOn = false;
if (SR) {
  recog = new SR(); recog.continuous = false; recog.interimResults = true; recog.lang = C.lang;
  recog.onresult = e => {
    const t = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('ti').value = t;
    if (e.results[e.results.length - 1].isFinal) { stopRec(); send(t); }
  };
  recog.onend = stopRec; recog.onerror = stopRec;
}
function startRec() {
  if (!recog) return setS('Speech recognition not supported', 4000);
  recOn = true; document.getElementById('mb').classList.add('rec'); setS('Listening...');
  try { recog.start(); } catch(e) {}
}
function stopRec() {
  recOn = false; document.getElementById('mb').classList.remove('rec');
  if (document.getElementById('st').textContent === 'Listening...') setS('');
  try { recog?.stop(); } catch(e) {}
}
document.getElementById('mb').onclick = () => recOn ? stopRec() : startRec();

// ── Memory module ─────────────────────────────────────────────────────────────
function renderMems() {
  const list = document.getElementById('mem-list');
  if (memories.length === 0) {
    list.innerHTML = '<div class="mem-empty">No memories yet.<br>Chat a while and they\'ll appear here.</div>';
    return;
  }
  list.innerHTML = memories.map(m => `
    <div class="mem-item" data-id="${m.id}">
      <textarea class="mem-txt" rows="1" onchange="editMem('${m.id}',this.value)" oninput="autoH(this)">${m.content}</textarea>
      <button class="mem-del" onclick="delMem('${m.id}')">×</button>
    </div>`).join('');
  list.querySelectorAll('.mem-txt').forEach(t => autoH(t));
}

function autoH(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

function editMem(id, val) {
  const m = memories.find(x => x.id === id);
  if (m) { m.content = val.trim(); m.ts = Date.now(); saveMem(); updateMemUpd(); }
}

function delMem(id) {
  memories = memories.filter(x => x.id !== id);
  saveMem(); renderMems(); updateMemUpd();
}

function addMem(content) {
  content = content.trim();
  if (!content || memories.some(m => m.content === content)) return;
  memories.push({ id: memId(), content, ts: Date.now() });
  saveMem(); renderMems(); updateMemUpd();
}

function updateMemUpd() {
  if (!memories.length) { document.getElementById('mem-upd').textContent = ''; return; }
  const last = Math.max(...memories.map(m => m.ts));
  const diff = Math.round((Date.now() - last) / 60000);
  document.getElementById('mem-upd').textContent = diff < 1 ? 'just now' : diff + ' min ago';
}

// Memory extraction for timed modes
async function extractMemories() {
  if (!C.apiKey || hist.length < 4) return;
  const recent = hist.slice(-8).map(h => `${h.role}: ${h.content}`).join('\n');
  const prompt = `Review this conversation and extract important personal facts about the user worth remembering long-term (name, preferences, goals, relationships, habits). Be concise and factual.
Conversation:
${recent}

Respond ONLY with JSON: {"mem":["fact1","fact2"]} or {"mem":[]} if nothing worth saving.`;

  try {
    const fmt = detectFormat(C.apiUrl);
    let raw = '';
    if (fmt === 'anthropic') {
      const r = await fetch(`${C.apiUrl}/messages`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': C.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
        body: JSON.stringify({ model: C.model, max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
      });
      if (!r.ok) return;
      const d = await r.json(); raw = d.content[0].text;
    } else {
      const r = await fetch(`${C.apiUrl}/chat/completions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${C.apiKey}` },
        body: JSON.stringify({ model: C.model, max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
      });
      if (!r.ok) return;
      const d = await r.json(); raw = d.choices[0].message.content;
    }
    const p = JSON.parse(raw.replace(/```json|```/g,'').trim());
    if (Array.isArray(p.mem) && p.mem.length > 0) {
      p.mem.forEach(content => {
        if (content && !memories.some(m => m.content === content.trim())) {
          memories.push({ id: memId(), content: content.trim(), ts: Date.now() });
        }
      });
      saveMem(); renderMems(); updateMemUpd();
    }
  } catch(e) {}
}

// Interval timer
let memTimer = null;
function setupMemTimer() {
  clearInterval(memTimer);
  if (C.memInterval === 'auto') return;
  memTimer = setInterval(extractMemories, parseInt(C.memInterval) * 60 * 1000);
}

// Memory panel UI
const memSheet = document.getElementById('mem-sheet');
const memOv = document.getElementById('mem-ov');
const openMem = () => { renderMems(); updateMemUpd(); memSheet.classList.add('on'); memOv.classList.add('on'); };
const closeMem = () => { memSheet.classList.remove('on'); memOv.classList.remove('on'); };

document.getElementById('mbtn').onclick = openMem;
document.getElementById('mem-close').onclick = closeMem;
memOv.onclick = closeMem;

// Interval buttons
document.querySelectorAll('.mint').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mint').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    C.memInterval = btn.dataset.v;
    save(); setupMemTimer();
  };
});

// Set active interval button from saved config
document.querySelectorAll('.mint').forEach(b => {
  b.classList.toggle('on', b.dataset.v === C.memInterval);
});

// Manual add
document.getElementById('mem-add-btn').onclick = () => {
  const inp = document.getElementById('mem-inp');
  addMem(inp.value); inp.value = '';
};
document.getElementById('mem-inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') { addMem(e.target.value); e.target.value = ''; }
});

setupMemTimer();

// ── iOS install hint ──────────────────────────────────────────────────────────
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.navigator.standalone === true;
if (isIOS && !isStandalone && !localStorage.getItem('hint-dismissed')) {
  const hint = document.getElementById('install-hint');
  setTimeout(() => { hint.style.display = 'block'; }, 2000);
  hint.addEventListener('click', () => { hint.style.display = 'none'; localStorage.setItem('hint-dismissed','1'); });
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (!C.apiKey) setS('Open ⚙ to add API keys');
</script>
</body>
</html>
